worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Basic request size / rate guards at the edge
  client_max_body_size 64k;
  limit_req_zone $binary_remote_addr zone=hp_limit:10m rate=30r/s;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Monitoring console (authenticated separately by the app)
    location /soc/ {
      limit_req zone=hp_limit burst=20 nodelay;
      proxy_pass http://dashboard:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 120s;
    }

    location = /soc {
      return 302 /soc/;
    }

    # Everything else hits the honeypot
    location / {
      limit_req zone=hp_limit burst=40 nodelay;
      proxy_pass http://honeypot:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_buffering off;
    }
  }
}
